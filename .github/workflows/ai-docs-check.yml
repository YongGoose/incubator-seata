# Fails when docs/ai/ no longer matches the code it is generated from.
# Fix a failure by running `make ai-docs` and committing the result.
name: "AI docs check"

on:
  pull_request:
    branches: [ 2.x, develop, master ]
  push:
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '**/META-INF/services/**'
      - 'docs/ai/**'
      - 'tools/ai-docs/**'
      - '.github/workflows/ai-docs-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: "docs/ai is up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated maps
        run: python3 tools/ai-docs/generate.py --check
